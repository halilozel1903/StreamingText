name: StreamingTextDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
packages:
  StreamingText:
    path: ..
targets:
  StreamingTextDemo:
    type: application
    platform: iOS
    sources:
      - StreamingTextDemo
    dependencies:
      - package: StreamingText
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.StreamingTextDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  StreamingTextDemo:
    build:
      targets:
        StreamingTextDemo: all
    run:
      config: Debug
