<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="StreamingText: smooth streaming text for AI chat in SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="228" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-2">StreamingText</text>
    <text x="82" y="282" fill="#cbd5e1" font-size="27" font-weight="500">Smooth, Markdown-aware streaming text</text>
    <text x="82" y="318" fill="#cbd5e1" font-size="27" font-weight="500">for AI chat apps in SwiftUI</text>
    <rect x="82" y="352" width="260" height="6" rx="3" fill="url(#accent)"/>

    <g filter="url(#shadow)">
      <rect x="700" y="80" width="500" height="400" rx="36" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="930" y="116" width="238" height="52" rx="22" fill="#6366f1"/>
      <text x="1049" y="149" fill="#ffffff" font-size="19" font-weight="600" text-anchor="middle">Explain SwiftUI state</text>

      <circle cx="746" cy="214" r="16" fill="url(#accent)"/>
      <path d="M746 204 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#0b1020"/>
      <g font-size="20" fill="#e5e7eb">
        <text x="776" y="220">Use <tspan font-weight="800" fill="#ffffff">@State</tspan> for values a view</text>
        <text x="776" y="252">owns, and <tspan font-family="SFMono-Regular, Menlo, monospace" fill="#fbbf24">@Binding</tspan> to share</text>
        <text x="776" y="284">them with a child. For shared</text>
        <text x="776" y="316">models, mark the class <tspan font-style="italic">@Observ</tspan><tspan fill="#22d3ee">&#x258D;</tspan></text>
      </g>
      <g opacity="0.55">
        <rect x="776" y="344" width="260" height="10" rx="5" fill="#374151"/>
        <rect x="776" y="366" width="200" height="10" rx="5" fill="#374151"/>
      </g>
      <rect x="730" y="410" width="440" height="44" rx="22" fill="#1f2937"/>
      <text x="754" y="438" fill="#6b7280" font-size="17">Message</text>
      <circle cx="1146" cy="432" r="15" fill="#6366f1"/>
      <rect x="1140" y="426" width="12" height="12" rx="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
